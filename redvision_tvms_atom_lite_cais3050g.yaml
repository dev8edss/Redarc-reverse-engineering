switch:
  # TVMS1280 output command format: 0x0F002420, data CB 00 FF <channel> <0/1> 00 00 00.
  # Working assumption supplied by user: Output 1..10 = channels 0x04..0x0D. Output 6/7 are confirmed from large log(2).
  # ASSUMED_UNCONFIRMED_TVMS1280_CHANNEL_MAP: TVMS1280 Output 1 channel 0x04.
  - platform: template
    id: tvms1280_output_1_switch
    name: "TVMS1280 Output 1 (Unconfirmed)"
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          id(rv_can).send_data(0x0F002420UL, true, std::vector<uint8_t>{0xCB, 0x00, 0xFF, 0x04, 0x01, 0x00, 0x00, 0x00});
          id(tvms1280_output_1_switch).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(rv_can).send_data(0x0F002420UL, true, std::vector<uint8_t>{0xCB, 0x00, 0xFF, 0x04, 0x00, 0x00, 0x00, 0x00});
