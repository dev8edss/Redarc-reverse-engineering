substitutions:
  device_name: redvision_can_bridge
  friendly_name: Redvision CAN Bridge

  # M5Stack Atom CAN Base / CA-IS3050G transceiver pins.
  can_tx_pin: GPIO22
  can_rx_pin: GPIO19

  # RedVision/TVMS bus speed.
  can_bit_rate: 250KBPS

  # NORMAL is required for the switch entities below to transmit CAN frames.
  # Change to LISTENONLY for passive monitoring only.
  can_mode: NORMAL

  sensor_average_interval: 5s

  # J1939-style source addresses.
  manager30_sa: "0x01"
  battery_sensor_sa: "0x08"
  redvision_1_sa: "0x20"
  redvision_2_sa: "0x21"
  tvms_1280_sa: "0x24"
  tvms_rouge_sa: "0x30"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "M5Stack Atom Lite + Atomic CAN Base / CA-IS3050G RedVision CAN bridge with dimmable Rouge lights and TVMS1280 output switches"

esp32:
  board: m5stack-atom
  framework:
    type: arduino

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

canbus:
  - platform: esp32_can
    id: rv_can
    tx_pin: ${can_tx_pin}
    rx_pin: ${can_rx_pin}
    can_id: 0x7FE
    use_extended_id: true
    bit_rate: ${can_bit_rate}
    mode: ${can_mode}
    rx_queue_len: 64

    # Accept all extended frames and decode only known RedVision/TVMS IDs.
    on_frame:
      - can_id: 0x00000000
        can_id_mask: 0x00000000
        use_extended_id: true
        remote_transmission_request: false
        then:
          - lambda: |-
              if (x.size() < 8) return;

              const uint32_t id_rx = can_id & 0x1FFFFFFFUL;

              const uint32_t ID_MANAGER_CURRENT        = 0x03F20A00UL | (uint32_t) ${manager30_sa};
              const uint32_t ID_MANAGER_SOLAR          = 0x03F20800UL | (uint32_t) ${manager30_sa};
              const uint32_t ID_BATTERY_CURRENT        = 0x13F10200UL | (uint32_t) ${battery_sensor_sa};
              const uint32_t ID_BATTERY_SOC            = 0x13F10400UL | (uint32_t) ${battery_sensor_sa};
              const uint32_t ID_RV1_CURRENT            = 0x13F28000UL | (uint32_t) ${redvision_1_sa};
              const uint32_t ID_RV2_CURRENT            = 0x13F28200UL | (uint32_t) ${redvision_2_sa};
              const uint32_t ID_ROUGE_TANKS            = 0x1BFD0200UL | (uint32_t) ${tvms_rouge_sa};
              const uint32_t ID_TVMS1280_TEMP_TANK     = 0x1BFD0200UL | (uint32_t) ${tvms_1280_sa};
              const uint32_t ID_TVMS1280_OUTPUT_STATUS = 0x1BFD0000UL | (uint32_t) ${tvms_1280_sa};
              const uint32_t ID_ROUGE_COMMAND          = 0x0F003000UL | (uint32_t) ${redvision_1_sa};
              const uint32_t ID_ROUGE_OUTPUT_LEVEL     = 0x1BFD1200UL | (uint32_t) ${tvms_rouge_sa};
              const uint32_t ID_ROUGE_OUTPUT_STATUS    = 0x1BFD1400UL | (uint32_t) ${tvms_rouge_sa};
              const uint32_t ID_ROUGE_DIM_COMMAND      = 0x0F053000UL | (uint32_t) ${redvision_1_sa};
              const uint32_t ID_TVMS1280_COMMAND       = 0x0F002400UL | (uint32_t) ${redvision_1_sa};
              const uint32_t ID_TVMS1280_CHANNEL_STAT  = 0x1BFCF000UL | (uint32_t) ${tvms_1280_sa};

              auto u16_le = [&](int i) -> uint16_t {
                return (uint16_t) x[i] | ((uint16_t) x[i + 1] << 8);
              };

              auto u32_le = [&](int i) -> uint32_t {
                return ((uint32_t) x[i]) |
                       ((uint32_t) x[i + 1] << 8) |
                       ((uint32_t) x[i + 2] << 16) |
                       ((uint32_t) x[i + 3] << 24);
              };

              if (id_rx == ID_MANAGER_CURRENT) {
                const uint32_t raw = u32_le(0);
                const float amps = ((float) raw / 1000.0f) - 1000.0f;
                id(manager_output_current_a).publish_state(amps);
                id(manager_output_current_raw).publish_state((float) raw);
                id(manager_battery_voltage_v).publish_state((float) u16_le(4) * 0.001f);
                if (!isnan(id(battery_current_a).state)) {
                  id(source_device_current_a).publish_state(amps - id(battery_current_a).state);
                }
                return;
              }

              if (id_rx == ID_MANAGER_SOLAR) {
                const uint32_t raw_current = u32_le(0);
                const uint16_t raw_voltage = u16_le(4);
                const float solar_a = ((float) raw_current / 1000.0f) - 1000.0f;
                const float solar_v = ((float) raw_voltage * 0.001f);
                id(solar_input_current_a).publish_state(solar_a);
                id(solar_input_voltage_v).publish_state(solar_v);
                id(solar_input_power_w).publish_state(solar_a * solar_v);
                return;
              }

              if (id_rx == ID_BATTERY_CURRENT) {
                const uint32_t raw = u32_le(0);
                const float amps = ((float) raw / 1000.0f) - 1000.0f;
                id(battery_current_a).publish_state(amps);
                id(battery_current_raw).publish_state((float) raw);
                id(battery_voltage_v).publish_state((float) u16_le(4) * 0.001f);
                id(battery_temperature_c).publish_state((float) x[6] - 60.0f);
                if (!isnan(id(manager_output_current_a).state)) {
                  id(source_device_current_a).publish_state(id(manager_output_current_a).state - amps);
                }
                return;
              }

              if (id_rx == ID_BATTERY_SOC) {
                id(battery_soc_percent).publish_state((float) x[0]);
                return;
              }

              if (id_rx == ID_RV1_CURRENT) {
                const uint16_t raw_batt = u16_le(0);
                const uint16_t raw_load = u16_le(4);
                id(rv1_battery_current_display_a).publish_state(((float) raw_batt / 10.0f) - 1000.0f);
                id(rv1_device_current_display_a).publish_state(((float) raw_load / 10.0f) - 1000.0f);
                id(rv1_battery_current_display_raw).publish_state((float) raw_batt);
                id(rv1_device_current_display_raw).publish_state((float) raw_load);
                return;
              }

              if (id_rx == ID_RV2_CURRENT) {
                const uint16_t raw_mgr = u16_le(6);
                id(rv2_manager_output_current_display_a).publish_state(((float) raw_mgr / 10.0f) - 1000.0f);
                id(rv2_manager_output_current_display_raw).publish_state((float) raw_mgr);
                return;
              }

              // TVMS Rouge water tanks: 0x1BFD0230, D1=0x09, D2 tank1 %, D3 tank2 %.
              if (id_rx == ID_ROUGE_TANKS) {
                if (x[0] == 0x09) {
                  id(rouge_tank1_percent).publish_state((float) x[1]);
                  id(rouge_tank2_percent).publish_state((float) x[2]);
                }
                return;
              }

              // TVMS1280 temp/tank status: 0x1BFD0224.
              if (id_rx == ID_TVMS1280_TEMP_TANK) {
                if (x[0] == 0x14) {
                  id(tvms1280_temp1_c).publish_state((float) x[1] - 100.0f);
                  id(tvms1280_tank1_percent).publish_state((float) x[3]);
                  id(tvms1280_tank2_percent).publish_state((float) x[5]);
                } else if (x[0] == 0x11) {
                  id(tvms1280_temp2_c).publish_state((float) x[5] - 100.0f);
                } else if (x[0] == 0x17) {
                  id(tvms1280_tank3_percent).publish_state((float) x[1]);
                  id(tvms1280_tank4_percent).publish_state((float) x[3]);
                  id(tvms1280_tank5_percent).publish_state((float) x[5] * 1.25f);
                } else if (x[0] == 0x1A) {
                  id(tvms1280_tank6_percent).publish_state((float) x[1]);
                }
                return;
              }

              // Redvision_1 -> TVMS Rouge ON/OFF command: 0x0F003020, CB 00 FF <0x0C..0x15> <0/1> 00 00 00.
              // Keep this as diagnostics only. HA light state is driven by 0x1BFD1230 output level feedback.
              if (id_rx == ID_ROUGE_COMMAND) {
                if (x[0] == 0xCB && x[2] == 0xFF && x[3] >= 0x0C && x[3] <= 0x15) {
                  const uint8_t output_num = x[3] - 0x0B;  // 0x0C => output 1
                  const bool state = x[4] != 0;
                  id(rouge_last_output_command_channel).publish_state((float) output_num);
                  id(rouge_last_output_command_state).publish_state(state ? 1.0f : 0.0f);
                }
                return;
              }

              // TVMS Rouge output level feedback: 0x1BFD1230.
              // Use level feedback as the authoritative Home Assistant state:
              //   0% = off, 1..100% = on at that brightness.
              auto update_rouge_light_from_level = [&](uint8_t output_num, uint8_t raw_level) {
                if (raw_level > 100) return;  // 0xFF appears on unused/reserved bytes.
                const bool on = raw_level > 0;
                const float brightness = ((float) raw_level) / 100.0f;
                id(rouge_feedback_update) = true;
                switch (output_num) {
                  case 1: {
                    id(rouge_output_1_level_percent).publish_state((float) raw_level);
                    auto call = id(rouge_output_1_light).make_call();
                    call.set_state(on);
                    if (on) call.set_brightness(brightness);
                    call.set_transition_length(0);
                    call.perform();
                    break;
                  }
                  case 2: {
                    id(rouge_output_2_level_percent).publish_state((float) raw_level);
                    auto call = id(rouge_output_2_light).make_call();
                    call.set_state(on);
                    if (on) call.set_brightness(brightness);
                    call.set_transition_length(0);
                    call.perform();
                    break;
                  }
                  case 3: {
                    id(rouge_output_3_level_percent).publish_state((float) raw_level);
                    auto call = id(rouge_output_3_light).make_call();
                    call.set_state(on);
                    if (on) call.set_brightness(brightness);
                    call.set_transition_length(0);
                    call.perform();
                    break;
                  }
                  case 4: {
                    id(rouge_output_4_level_percent).publish_state((float) raw_level);
                    auto call = id(rouge_output_4_light).make_call();
                    call.set_state(on);
                    if (on) call.set_brightness(brightness);
                    call.set_transition_length(0);
                    call.perform();
                    break;
                  }
                  case 5: {
                    id(rouge_output_5_level_percent).publish_state((float) raw_level);
                    auto call = id(rouge_output_5_light).make_call();
                    call.set_state(on);
                    if (on) call.set_brightness(brightness);
                    call.set_transition_length(0);
                    call.perform();
                    break;
                  }
                  case 6: {
                    id(rouge_output_6_level_percent).publish_state((float) raw_level);
                    auto call = id(rouge_output_6_light).make_call();
                    call.set_state(on);
                    if (on) call.set_brightness(brightness);
                    call.set_transition_length(0);
                    call.perform();
                    break;
                  }
                  case 7: {
                    id(rouge_output_7_level_percent).publish_state((float) raw_level);
                    auto call = id(rouge_output_7_light).make_call();
                    call.set_state(on);
                    if (on) call.set_brightness(brightness);
                    call.set_transition_length(0);
                    call.perform();
                    break;
                  }
                  case 8: {
                    id(rouge_output_8_level_percent).publish_state((float) raw_level);
                    auto call = id(rouge_output_8_light).make_call();
                    call.set_state(on);
                    if (on) call.set_brightness(brightness);
                    call.set_transition_length(0);
                    call.perform();
                    break;
                  }
                  case 9: {
                    id(rouge_output_9_level_percent).publish_state((float) raw_level);
                    auto call = id(rouge_output_9_light).make_call();
                    call.set_state(on);
                    if (on) call.set_brightness(brightness);
                    call.set_transition_length(0);
                    call.perform();
                    break;
                  }
                  case 10: {
                    id(rouge_output_10_level_percent).publish_state((float) raw_level);
                    auto call = id(rouge_output_10_light).make_call();
                    call.set_state(on);
                    if (on) call.set_brightness(brightness);
                    call.set_transition_length(0);
                    call.perform();
                    break;
                  }
                }
                id(rouge_feedback_update) = false;
              };

              if (id_rx == ID_ROUGE_OUTPUT_LEVEL) {
                if (x[0] == 0x0C) {
                  update_rouge_light_from_level(1, x[1]);
                  update_rouge_light_from_level(2, x[2]);
                  update_rouge_light_from_level(3, x[3]);
                  update_rouge_light_from_level(4, x[4]);
                  update_rouge_light_from_level(5, x[5]);
                  update_rouge_light_from_level(6, x[6]);
                  update_rouge_light_from_level(7, x[7]);
                } else if (x[0] == 0x13) {
                  update_rouge_light_from_level(8, x[1]);
                  update_rouge_light_from_level(9, x[2]);
                  update_rouge_light_from_level(10, x[3]);
                }
                return;
              }

              // TVMS Rouge output on/off status feedback: 0x1BFD1430.
              // Do not use this bitfield to drive HA state because it has been observed to drop switches back to Off.
              // Rouge HA entities are driven from 0x1BFD1230 output level feedback instead.
              if (id_rx == ID_ROUGE_OUTPUT_STATUS) {
                return;
              }

              // Redvision_1 -> TVMS1280 ON/OFF commands: 0x0F002420, CB 00 FF <channel> <0/1> 00 00 00.
              // Working map: Output 1..10 = channels 0x04..0x0D. Confirmed: 0x09=Output 6, 0x0A=Output 7. Observed inverter: 0x0E.
              if (id_rx == ID_TVMS1280_COMMAND) {
                if (x[0] == 0xCB && x[2] == 0xFF) {
                  const uint8_t channel = x[3];
                  const bool state = x[4] != 0;
                  id(tvms1280_last_output_command_channel).publish_state((float) channel);
                  id(tvms1280_last_output_command_state).publish_state(state ? 1.0f : 0.0f);
                  switch (channel) {
                    case 0x04: id(tvms1280_output_1_switch).publish_state(state); break;
                    case 0x05: id(tvms1280_output_2_switch).publish_state(state); break;
                    case 0x06: id(tvms1280_output_3_switch).publish_state(state); break;
                    case 0x07: id(tvms1280_output_4_switch).publish_state(state); break;
                    case 0x08: id(tvms1280_output_5_switch).publish_state(state); break;
                    case 0x09: id(tvms1280_output_6_switch).publish_state(state); break;
                    case 0x0A: id(tvms1280_output_7_switch).publish_state(state); break;
                    case 0x0B: id(tvms1280_output_8_switch).publish_state(state); break;
                    case 0x0C: id(tvms1280_output_9_switch).publish_state(state); break;
                    case 0x0D: id(tvms1280_output_10_switch).publish_state(state); break;
                    case 0x0E: id(tvms1280_inverter_switch).publish_state(state); break;
                    default: break;
                  }
                }
                return;
              }

              // TVMS1280 multiplexed output status: 0x1BFD0024, page 0x08.
              // Only the previously observed status locations are used here. The 0x04..0x0D channel map below is used for commands.
              if (id_rx == ID_TVMS1280_OUTPUT_STATUS) {
                if (x[0] == 0x08) {
                  id(tvms1280_output_6_switch).publish_state((x[2] & 0x01) != 0);
                  id(tvms1280_output_7_switch).publish_state((x[3] & 0x01) != 0);
                  id(tvms1280_inverter_switch).publish_state((x[7] & 0x01) != 0);
                }
                return;
              }

              // TVMS1280 inverter/channel status: 0x1BFCF024, D2=0x0E, D1=state.
              if (id_rx == ID_TVMS1280_CHANNEL_STAT) {
                if (x[1] == 0x0E) {
                  id(tvms1280_inverter_switch).publish_state(x[0] != 0);
                }
                return;
              }

globals:
  # Prevent CAN feedback updates from retransmitting dim/on/off commands through template outputs.
  - id: rouge_feedback_update
    type: bool
    restore_value: no
    initial_value: 'false'

sensor:
  - platform: template
    id: manager_output_current_a
    name: "Manager30 Output Current"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - throttle_average: ${sensor_average_interval}
  - platform: template
    id: manager_output_current_raw
    name: "Manager30 Output Current Raw"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    filters:
      - throttle_average: ${sensor_average_interval}
  - platform: template
    id: manager_battery_voltage_v
    name: "Manager30 Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - throttle_average: ${sensor_average_interval}
  - platform: template
    id: solar_input_power_w
    name: "Solar Input Power"
