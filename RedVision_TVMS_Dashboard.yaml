  - type: custom:apexcharts-card
    header:
      show: true
      title: Solar — Daily Generation (Wh)
    graph_span: 12d
    series:
      - entity: sensor.redvision_can_bridge_manager30_solar_day_1_12_history
        name: Wh
        type: column
        data_generator: |
          const vals = (entity.state || "").split(",").filter((s) => s.length);
          const day = 86400000;
          const base = new Date();
          base.setHours(0, 0, 0, 0);
          return vals
            .map((v, i) => {
              const n = parseInt(v, 10);
              return [base.getTime() - (i) * day, (isNaN(n) || n === 255) ? null : n];
            })
            .sort((a, b) => a[0] - b[0]);
