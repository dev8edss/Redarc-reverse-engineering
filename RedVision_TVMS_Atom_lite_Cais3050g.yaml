substitutions:
  device_name: redvision_can_bridge
  friendly_name: Redvision CAN Bridge

  # M5Stack Atom CAN Base / CA-IS3050G transceiver pins.
  can_tx_pin: GPIO22
  can_rx_pin: GPIO19

  # RedVision/TVMS bus speed.
  can_bit_rate: 250KBPS

  # NORMAL is required for transmitting TVMS1280 and TVMS Rogue commands.
  # Use LISTENONLY only for passive monitoring.
  can_mode: NORMAL

  sensor_average_interval: 5s
  # How often to request SOC + solar history pages. Set to 0s to disable polling.
  history_poll_interval: 60s
  rogue_transition_length: 750ms
  board: m5stack-atom
  esp32_framework_type: esp-idf
  logger_level: DEBUG
  # Keep UART logging disabled when raw CAN debug is enabled. Use 115200 or 921600
  # only for short serial captures, because the CAN firehose can overflow UART.
  logger_baud_rate: "0"

  # ESP32 source address on the REDARC network (2 hex digits, no 0x prefix). Usually matches a redvision display address.
  host_address: "0x22"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "RedVision/TVMS CAN bridge v2; single redarc component"

esp32:
  board: ${board}
  framework:
    type: ${esp32_framework_type}

logger:
  level: ${logger_level}
  # Raw CAN debug logging can be very high volume; use API logging instead of
  # UART so DEBUG boots do not overflow the ESP-IDF UART ringbuffer.
  baud_rate: ${logger_baud_rate}
  logs:
    # Silence the built-in canbus "received can message" DEBUG line; the redarc
    # dispatcher already logs every frame at DEBUG with id/dgn/sa/rtr/dlc/data.
    canbus: INFO

api:
  encryption:
    key: !secret api_pass

ota:
  - platform: esphome
    password: !secret ota_pass

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/dev8edss/Redarc-reverse-engineering
      ref: main
    refresh: 0s
    components:
      - redarc

# Everything REDARC lives under the single `redarc:` component, including the CAN
# bus and the Home Assistant time source — no separate canbus:/time: blocks.
redarc:
  # CAN interface (same options as ESPHome's esp32_can platform).
  canbus:
    tx_pin: ${can_tx_pin}
    rx_pin: ${can_rx_pin}
    bit_rate: ${can_bit_rate}
    mode: ${can_mode}
    rx_queue_len: 64
  # Home Assistant time + the Manager "Set Time" button are enabled by default.
  # Add `time: false` to disable them.

  host_address: ${host_address}
  discovery_delay: 60s
  # Inherited by every device unless overridden in its sub-block.
  filter_interval: ${sensor_average_interval}
  # Inherited by the battery SOC poll and manager solar poll (0s = disable).
  history_poll_interval: ${history_poll_interval}
  # Light transition time inherited by the TVMS Rogue outputs.
  transition_length: ${rogue_transition_length}

  # Every device is a list, so adding a second of the same type is just another
  # `- ` entry (give the extra one a distinct source_address).
  battery_sensor:
    - id: Battery
      source_address: 0x08

  manager:
    - id: Manager30
      source_address: 0x01
      battery_sensor_id: Battery

  redvision_display:
    - id: Redvision1
      source_address: 0x20
    - id: Redvision2
      source_address: 0x21

  tvms_rogue:
    - id: TVMS_Rogue
      source_address: 0x30

  tvms_1280:
    - id: TVMS1280
      source_address: 0x24
