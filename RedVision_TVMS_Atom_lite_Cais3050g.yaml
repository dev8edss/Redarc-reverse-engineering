substitutions:
  device_name: redvision_can_bridge
  friendly_name: Redvision CAN Bridge

  # M5Stack Atom CAN Base / CA-IS3050G transceiver pins.
  can_tx_pin: GPIO22
  can_rx_pin: GPIO19

  # RedVision/TVMS bus speed.
  can_bit_rate: 250KBPS

  # NORMAL is required for transmitting TVMS1280 and TVMS Rogue commands.
  # Use LISTENONLY only for passive monitoring.
  can_mode: NORMAL

  sensor_average_interval: 5s
  # How often to request SOC + solar history pages. Set to 0s to disable polling.
  history_poll_interval: 60s
  rogue_transition_length: 750ms
  board: m5stack-atom
  esp32_framework_type: esp-idf
  logger_level: DEBUG
  # Keep UART logging disabled when raw CAN debug is enabled. Use 115200 or 921600
  # only for short serial captures, because the CAN firehose can overflow UART.
  logger_baud_rate: "0"

  # ESP32 source address on the REDARC network (2 hex digits, no 0x prefix). Usually matches a redvision display address.
  host_address: "0x22"

packages:
  # Core infrastructure — ESPHome, ESP32, Wi-Fi, CAN hardware, external components.
  base:
    url: https://github.com/dev8edss/Redarc-reverse-engineering
    ref: main
    files: [packages/base.yaml]
    refresh: 0s

# All REDARC devices live under the single `redarc:` component.
# Include only the devices present on your bus — remove any sub-block for
# devices you don't have. Each device `id` becomes the entity name prefix
# (no spaces, use underscores).

redarc:
  canbus_id: rv_can
  host_address: ${host_address}
  discovery_delay: 60s
  # Inherited by every device unless overridden in its sub-block.
  filter_interval: ${sensor_average_interval}
  # Inherited by the battery SOC poll and manager solar poll (0s = disable).
  history_poll_interval: ${history_poll_interval}
  # Light transition time inherited by the TVMS Rogue outputs.
  transition_length: ${rogue_transition_length}

  # Every device is a list, so adding a second of the same type is just another
  # `- ` entry (give the extra one a distinct source_address).
  battery_sensor:
    - id: Battery
      source_address: 0x08

  manager:
    - id: Manager30
      source_address: 0x01
      battery_sensor_id: Battery
      time_id: ha_time

  redvision_display:
    - id: Redvision1
      source_address: 0x20
    - id: Redvision2
      source_address: 0x21

  tvms_rogue:
    - id: TVMS_Rogue
      source_address: 0x30

  tvms_1280:
    - id: TVMS1280
      source_address: 0x24
