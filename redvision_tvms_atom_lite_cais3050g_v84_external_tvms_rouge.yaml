substitutions:
  device_name: redvision_can_bridge
  friendly_name: Redvision CAN Bridge

  # M5Stack Atom CAN Base / CA-IS3050G transceiver pins.
  can_tx_pin: GPIO22
  can_rx_pin: GPIO19

  # RedVision/TVMS bus speed.
  can_bit_rate: 250KBPS

  # NORMAL is required for the switch entities below to transmit CAN frames.
  # Change to LISTENONLY for passive monitoring only.
  can_mode: NORMAL

  sensor_average_interval: 5s

  # J1939-style source addresses.
  manager30_sa: "0x01"
  battery_sensor_sa: "0x08"
  redvision_1_sa: "0x20"
  redvision_2_sa: "0x21"
  tvms_1280_sa: "0x24"
  tvms_rouge_sa: "0x30"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "M5Stack Atom Lite + Atomic CAN Base / CA-IS3050G RedVision CAN bridge; v84 external tvms_rouge component; true-off threshold <=1%; Rouge dimmable lights; all TVMS1280 outputs"

esp32:
  board: m5stack-atom
  framework:
    type: arduino

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

external_components:
  - source:
      type: local
      path: components
    components: [tvms_rouge]

canbus:
  - platform: esp32_can
    id: rv_can
    tx_pin: ${can_tx_pin}
    rx_pin: ${can_rx_pin}
    can_id: 0x7FE
    use_extended_id: true
    bit_rate: ${can_bit_rate}
    mode: ${can_mode}
    rx_queue_len: 64

    # Accept all extended frames and decode only known RedVision/TVMS IDs.
    on_frame:
      - can_id: 0x00000000
        can_id_mask: 0x00000000
        use_extended_id: true
        remote_transmission_request: false
        then:
          - lambda: |-
              if (x.size() < 8) return;

              const uint32_t id_rx = can_id & 0x1FFFFFFFUL;
              id(tvms_rouge_hub).handle_can_frame(id_rx, x);

              const uint32_t ID_MANAGER_CURRENT        = 0x03F20A00UL | (uint32_t) ${manager30_sa};
              const uint32_t ID_MANAGER_SOLAR          = 0x03F20800UL | (uint32_t) ${manager30_sa};
              const uint32_t ID_BATTERY_CURRENT        = 0x13F10200UL | (uint32_t) ${battery_sensor_sa};
              const uint32_t ID_BATTERY_SOC            = 0x13F10400UL | (uint32_t) ${battery_sensor_sa};
              const uint32_t ID_RV1_CURRENT            = 0x13F28000UL | (uint32_t) ${redvision_1_sa};
              const uint32_t ID_RV2_CURRENT            = 0x13F28200UL | (uint32_t) ${redvision_2_sa};
              const uint32_t ID_ROUGE_TANKS            = 0x1BFD0200UL | (uint32_t) ${tvms_rouge_sa};
              const uint32_t ID_TVMS1280_TEMP_TANK     = 0x1BFD0200UL | (uint32_t) ${tvms_1280_sa};
              const uint32_t ID_TVMS1280_OUTPUT_STATUS = 0x1BFD0000UL | (uint32_t) ${tvms_1280_sa};
              const uint32_t ID_ROUGE_COMMAND          = 0x0F003000UL | (uint32_t) ${redvision_1_sa};
              const uint32_t ID_ROUGE_OUTPUT_LEVEL     = 0x1BFD1200UL | (uint32_t) ${tvms_rouge_sa};
              const uint32_t ID_ROUGE_OUTPUT_STATUS    = 0x1BFD1400UL | (uint32_t) ${tvms_rouge_sa};
              const uint32_t ID_TVMS1280_COMMAND       = 0x0F002400UL | (uint32_t) ${redvision_1_sa};
              const uint32_t ID_TVMS1280_CHANNEL_STAT  = 0x1BFCF000UL | (uint32_t) ${tvms_1280_sa};

              auto u16_le = [&](int i) -> uint16_t {
                return (uint16_t) x[i] | ((uint16_t) x[i + 1] << 8);
              };

              auto u32_le = [&](int i) -> uint32_t {
                return ((uint32_t) x[i]) |
                       ((uint32_t) x[i + 1] << 8) |
                       ((uint32_t) x[i + 2] << 16) |
                       ((uint32_t) x[i + 3] << 24);
              };

              if (id_rx == ID_MANAGER_CURRENT) {
                const uint32_t raw = u32_le(0);
                const float amps = ((float) raw / 1000.0f) - 1000.0f;
                id(manager_output_current_a).publish_state(amps);
                id(manager_output_current_raw).publish_state((float) raw);
                id(manager_battery_voltage_v).publish_state((float) u16_le(4) * 0.001f);
                if (!isnan(id(battery_current_a).state)) {
                  id(source_device_current_a).publish_state(amps - id(battery_current_a).state);
                }
                return;
              }

              if (id_rx == ID_MANAGER_SOLAR) {
                const uint32_t raw_current = u32_le(0);
                const uint16_t raw_voltage = u16_le(4);
                const float solar_a = ((float) raw_current / 1000.0f) - 1000.0f;
                const float solar_v = ((float) raw_voltage * 0.001f);
                id(solar_input_current_a).publish_state(solar_a);
                id(solar_input_voltage_v).publish_state(solar_v);
                id(solar_input_power_w).publish_state(solar_a * solar_v);
                return;
              }

              if (id_rx == ID_BATTERY_CURRENT) {
                const uint32_t raw = u32_le(0);
                const float amps = ((float) raw / 1000.0f) - 1000.0f;
                id(battery_current_a).publish_state(amps);
                id(battery_current_raw).publish_state((float) raw);
                id(battery_voltage_v).publish_state((float) u16_le(4) * 0.001f);
                id(battery_temperature_c).publish_state((float) x[6] - 60.0f);
                if (!isnan(id(manager_output_current_a).state)) {
                  id(source_device_current_a).publish_state(id(manager_output_current_a).state - amps);
                }
                return;
              }

              if (id_rx == ID_BATTERY_SOC) {
                id(battery_soc_percent).publish_state((float) x[0]);
                return;
              }

              if (id_rx == ID_RV1_CURRENT) {
                const uint16_t raw_batt = u16_le(0);
                const uint16_t raw_load = u16_le(4);
                id(rv1_battery_current_display_a).publish_state(((float) raw_batt / 10.0f) - 1000.0f);
                id(rv1_device_current_display_a).publish_state(((float) raw_load / 10.0f) - 1000.0f);
                id(rv1_battery_current_display_raw).publish_state((float) raw_batt);
                id(rv1_device_current_display_raw).publish_state((float) raw_load);
                return;
              }

              if (id_rx == ID_RV2_CURRENT) {
                const uint16_t raw_mgr = u16_le(6);
                id(rv2_manager_output_current_display_a).publish_state(((float) raw_mgr / 10.0f) - 1000.0f);
                id(rv2_manager_output_current_display_raw).publish_state((float) raw_mgr);
                return;
              }

              // TVMS Rouge water tanks: 0x1BFD0230, D1=0x09, D2 tank1 %, D3 tank2 %.
              if (id_rx == ID_ROUGE_TANKS) {
                if (x[0] == 0x09) {
                  id(rouge_tank1_percent).publish_state((float) x[1]);
                  id(rouge_tank2_percent).publish_state((float) x[2]);
                }
                return;
              }

              // TVMS1280 temp/tank status: 0x1BFD0224.
              if (id_rx == ID_TVMS1280_TEMP_TANK) {
                if (x[0] == 0x14) {
                  id(tvms1280_temp1_c).publish_state((float) x[1] - 100.0f);
                  id(tvms1280_tank1_percent).publish_state((float) x[3]);
                  id(tvms1280_tank2_percent).publish_state((float) x[5]);
                } else if (x[0] == 0x11) {
                  id(tvms1280_temp2_c).publish_state((float) x[5] - 100.0f);
                } else if (x[0] == 0x17) {
                  id(tvms1280_tank3_percent).publish_state((float) x[1]);
                  id(tvms1280_tank4_percent).publish_state((float) x[3]);
                  id(tvms1280_tank5_percent).publish_state((float) x[5] * 1.25f);
                } else if (x[0] == 0x1A) {
                  id(tvms1280_tank6_percent).publish_state((float) x[1]);
                }
                return;
              }

              // Redvision_1 -> TVMS Rouge ON/OFF command: 0x0F003020, CB 00 FF <0x0C..0x15> <0/1> 00 00 00.
              if (id_rx == ID_ROUGE_COMMAND) {
                if (x[0] == 0xCB && x[2] == 0xFF && x[3] >= 0x0C && x[3] <= 0x15) {
                  const uint8_t output_num = x[3] - 0x0B;  // 0x0C => output 1
                  const bool state = x[4] != 0;
                  id(rouge_last_output_command_channel).publish_state((float) output_num);
                  id(rouge_last_output_command_state).publish_state(state ? 1.0f : 0.0f);
                  switch (output_num) {
                    case 1: id(rouge_output_1_switch).publish_state(state); break;
                    case 2: id(rouge_output_2_switch).publish_state(state); break;
                    case 3: id(rouge_output_3_switch).publish_state(state); break;
                    case 4: id(rouge_output_4_switch).publish_state(state); break;
                    case 5: id(rouge_output_5_switch).publish_state(state); break;
                    case 6: id(rouge_output_6_switch).publish_state(state); break;
                    case 7: id(rouge_output_7_switch).publish_state(state); break;
                    case 8: id(rouge_output_8_switch).publish_state(state); break;
                    case 9: id(rouge_output_9_switch).publish_state(state); break;
                    case 10: id(rouge_output_10_switch).publish_state(state); break;
                  }
                }
                return;
              }

              // TVMS Rouge output level feedback: 0x1BFD1230.
              // Use this as the Home Assistant switch state source.
              // In v55 the 0x1BFD1430 bitfield could report off even while the level stayed 100%,
              // which made HA show the switch as off shortly after a successful ON command.
              auto publish_rouge_level_and_state = [&](uint8_t output_num, uint8_t raw_level) {
                // Valid level range is 0..100%. Ignore 0xFF / invalid bytes instead of forcing ON.
                if (raw_level > 100) return;
                const float level = (float) raw_level;
                switch (output_num) {
                  case 1:
                    id(rouge_output_1_level_percent).publish_state(level);
                    id(rouge_output_1_switch).publish_state(raw_level > 0);
                    break;
                  case 2:
                    id(rouge_output_2_level_percent).publish_state(level);
                    id(rouge_output_2_switch).publish_state(raw_level > 0);
                    break;
                  case 3:
                    id(rouge_output_3_level_percent).publish_state(level);
                    id(rouge_output_3_switch).publish_state(raw_level > 0);
                    break;
                  case 4:
                    id(rouge_output_4_level_percent).publish_state(level);
                    id(rouge_output_4_switch).publish_state(raw_level > 0);
                    break;
                  case 5:
                    id(rouge_output_5_level_percent).publish_state(level);
                    id(rouge_output_5_switch).publish_state(raw_level > 0);
                    break;
                  case 6:
                    id(rouge_output_6_level_percent).publish_state(level);
                    id(rouge_output_6_switch).publish_state(raw_level > 0);
                    break;
                  case 7:
                    id(rouge_output_7_level_percent).publish_state(level);
                    id(rouge_output_7_switch).publish_state(raw_level > 0);
                    break;
                  case 8:
                    id(rouge_output_8_level_percent).publish_state(level);
                    id(rouge_output_8_switch).publish_state(raw_level > 0);
                    break;
                  case 9:
                    id(rouge_output_9_level_percent).publish_state(level);
                    id(rouge_output_9_switch).publish_state(raw_level > 0);
                    break;
                  case 10:
                    id(rouge_output_10_level_percent).publish_state(level);
                    id(rouge_output_10_switch).publish_state(raw_level > 0);
                    break;
                }
              };

              if (id_rx == ID_ROUGE_OUTPUT_LEVEL) {
                if (x[0] == 0x0C) {
                  publish_rouge_level_and_state(1, x[1]);
                  publish_rouge_level_and_state(2, x[2]);
                  publish_rouge_level_and_state(3, x[3]);
                  publish_rouge_level_and_state(4, x[4]);
                  publish_rouge_level_and_state(5, x[5]);
                  publish_rouge_level_and_state(6, x[6]);
                  publish_rouge_level_and_state(7, x[7]);
                } else if (x[0] == 0x13) {
                  publish_rouge_level_and_state(8, x[1]);
                  publish_rouge_level_and_state(9, x[2]);
                  publish_rouge_level_and_state(10, x[3]);
                }
                return;
              }

              // TVMS Rouge output bitfield feedback: 0x1BFD1430.
              // Intentionally ignored for HA switch state because it caused false OFF reports.
              // The level feedback above is the state source: level > 0 means ON.
              if (id_rx == ID_ROUGE_OUTPUT_STATUS) {
                return;
              }

              // Redvision_1 -> TVMS1280 ON/OFF commands: 0x0F002420, CB 00 FF <channel> <0/1> 00 00 00.
              // Working assumption: Output 1..10 use channels 0x04..0x0D.
              // Confirmed by user/log: 0x09=Output 6, 0x0A=Output 7. Observed: 0x0E=Inverter.
              if (id_rx == ID_TVMS1280_COMMAND) {
                if (x[0] == 0xCB && x[2] == 0xFF) {
                  const uint8_t channel = x[3];
                  const bool state = x[4] != 0;
                  id(tvms1280_last_output_command_channel).publish_state((float) channel);
                  id(tvms1280_last_output_command_state).publish_state(state ? 1.0f : 0.0f);
                  if (channel >= 0x04 && channel <= 0x0D) {
                    const uint8_t output_num = channel - 0x03;  // 0x04 => output 1
                    switch (output_num) {
                      case 1: id(tvms1280_output_1_switch).publish_state(state); break;
                      case 2: id(tvms1280_output_2_switch).publish_state(state); break;
                      case 3: id(tvms1280_output_3_switch).publish_state(state); break;
                      case 4: id(tvms1280_output_4_switch).publish_state(state); break;
                      case 5: id(tvms1280_output_5_switch).publish_state(state); break;
                      case 6: id(tvms1280_output_6_switch).publish_state(state); break;
                      case 7: id(tvms1280_output_7_switch).publish_state(state); break;
                      case 8: id(tvms1280_output_8_switch).publish_state(state); break;
                      case 9: id(tvms1280_output_9_switch).publish_state(state); break;
                      case 10: id(tvms1280_output_10_switch).publish_state(state); break;
                    }
                  } else if (channel == 0x0E) {
                    id(tvms1280_inverter_switch).publish_state(state);
                  }
                }
                return;
              }

              // TVMS1280 multiplexed output status: 0x1BFD0024, page 0x08.
              // Only the previously observed Output 6, Output 7, and Inverter bits are used here.
              if (id_rx == ID_TVMS1280_OUTPUT_STATUS) {
                if (x[0] == 0x08) {
                  id(tvms1280_output_6_switch).publish_state((x[2] & 0x01) != 0);
                  id(tvms1280_output_7_switch).publish_state((x[3] & 0x01) != 0);
                  id(tvms1280_inverter_switch).publish_state((x[7] & 0x01) != 0);
                }
                return;
              }

              // TVMS1280 inverter/channel status: 0x1BFCF024, D2=0x0E, D1=state.
              if (id_rx == ID_TVMS1280_CHANNEL_STAT) {
                if (x[1] == 0x0E) {
                  id(tvms1280_inverter_switch).publish_state(x[0] != 0);
                }
                return;
              }

tvms_rouge:
  id: tvms_rouge_hub
  canbus_id: rv_can
  output_command_id: 0x0F003020
  dim_command_id: 0x0F053020
  keepalive_id: 0x0FE6FF20
  level_feedback_id: 0x1BFD1230
  true_off_threshold: 1.0
  target_debounce: 600ms
  start_deadline: 2500ms
  default_deadband: 3.0
  initial_rate_ms_per_percent: 50.0
  learning_gain: 0.25
  approach: 0.80
  max_pulse: 1200ms
  settle_time: 700ms
  max_iterations: 12

sensor:
  - platform: template
    id: manager_output_current_a
    name: "Manager30 Output Current"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - throttle_average: ${sensor_average_interval}
  - platform: template
    id: manager_output_current_raw
    name: "Manager30 Output Current Raw"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    filters:
      - throttle_average: ${sensor_average_interval}
  - platform: template
    id: manager_battery_voltage_v
    name: "Manager30 Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - throttle_average: ${sensor_average_interval}
  - platform: template
    id: solar_input_power_w
    name: "Solar Input Power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - throttle_average: ${sensor_average_interval}
  - platform: template
    id: solar_input_current_a
    name: "Solar Input Current"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    entity_category: diagnostic
