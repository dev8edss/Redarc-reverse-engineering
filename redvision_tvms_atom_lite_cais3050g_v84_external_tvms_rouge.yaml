    name: "TVMS1280 Output 10 (Unconfirmed)"
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          id(rv_can).send_data(0x0F002420UL, true, std::vector<uint8_t>{0xCB, 0x00, 0xFF, 0x0D, 0x01, 0x00, 0x00, 0x00});
          id(tvms1280_output_10_switch).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(rv_can).send_data(0x0F002420UL, true, std::vector<uint8_t>{0xCB, 0x00, 0xFF, 0x0D, 0x00, 0x00, 0x00, 0x00});
          id(tvms1280_output_10_switch).publish_state(false);
