    filters:
      - throttle_average: ${sensor_average_interval}
  - platform: template
    id: solar_input_voltage_v
    name: "Solar Input Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
