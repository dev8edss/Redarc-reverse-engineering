# Complete TVMS Rogue emulator example for Atom Lite + Atomic CAN base.
# Required: set wifi_ssid, wifi_password and api_encryption_key in secrets.yaml.
# Required: choose a source_address unused by any real device on this CAN bus.
# YAML controls CAN identity. A saved Object 2 may contain different identity
# bytes in readback; see README_emulated_rogue.md for details.

esphome:
  name: virtual-tvms-rogue
  friendly_name: Virtual TVMS Rogue

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/dev8edss/Redarc-reverse-engineering
      ref: emulated-rogue
    components:
      - redarc

redarc:
  # Required: exactly one of canbus or canbus_id. CAN NORMAL mode transmits.
  canbus:
    tx_pin: GPIO22          # Optional in redarc.canbus; default GPIO22.
    rx_pin: GPIO19          # Optional in redarc.canbus; default GPIO19.
    bit_rate: 250KBPS      # Optional in redarc.canbus; default 250KBPS.
    mode: NORMAL           # Set explicitly for active emulation.
    can_id: 0x7FE          # Optional in redarc.canbus; default 0x7FE.
    use_extended_id: true # Optional in redarc.canbus; default true.
    # rx_queue_len: 64     # Default when supported by installed ESPHome.

  # Required: one emulator entry to emulate a Rogue. All entry fields are optional.
  tvms_rogue_emulator:
    - id: virtual_rogue            # Optional; ESPHome generates one if omitted.
      source_address: 0x36         # Optional; default 0x30. MUST be unique on bus.
      identity_interval: 1s        # Optional; default 1s; positive duration.
      status_interval: 1s          # Optional; default 1s; positive duration.
      random_update_interval: 5s   # Optional; default 5s; 0s is not accepted.
      randomize_inputs: false      # Optional; default true.
      serial_prefix: 2606260001   # Optional; default 0; choose your virtual serial.
      serial_suffix: 0x0013       # Optional; default 0x0013; now configurable.
      device_subtype: 0x00        # Optional; default 0.
      version_records:             # Optional; defaults to these two records.
        - product_number: 323      # Required within each version record.
          major: 1                 # Required within each version record.
          minor: 4                 # Required within each version record.
          record_index: 0          # Optional within record; default 0.
        - product_number: 323
          major: 0
          minor: 4
          record_index: 1
      manufacturing_date:          # Optional; default day 1, month 1, year 2026.
        day: 1                     # Required when manufacturing_date is specified.
        month: 1                   # Required when manufacturing_date is specified.
        year: 2026                 # Required when manufacturing_date is specified.
      product_name: "TVMS Rogue"   # Optional; default "TVMS Rogue"; ASCII only.
      unique_identifier: "00:00:00:00:00:00:01" # Optional; default shown; 7 bytes.
      unique_identifier_record_index: 0         # Optional; default 0.
      # tank1_source: fresh_tank_percent # Optional; default no sensor source.
      # tank2_source: waste_tank_percent # Optional; default no sensor source.

# For tank*_source, define ESPHome sensors with matching IDs elsewhere in this
# same YAML. Uncomment only when those sources exist. Supplying either tank
# source disables the emulator's random sensor update timer.
