title: RedVision TVMS
path: redvision-tvms
icon: mdi:caravan
badges: []
cards:
  - type: markdown
    content: |
      # RedVision / TVMS CAN Monitor
      Live data from the ESPHome Atom Lite CAN bridge.

      **Device current** is calculated as:

      `Manager30 Output Current - Battery Current`

      Battery current is positive while charging and negative while discharging.

  - square: false
    type: grid
    title: Power Summary
    columns: 2
    cards:
      - type: gauge
        name: Battery SOC
        entity: sensor.redvision_can_bridge_battery_soc
        min: 0
        max: 100
        severity:
          green: 25
          yellow: 10
          red: 0
        needle: false
      - type: gauge
        name: Battery Current
        entity: sensor.redvision_can_bridge_battery_current
        min: -250
        max: 80
        needle: true
        severity:
          green: 0
          yellow: 500
          red: -250
      - type: gauge
        name: Manager30 Output
        entity: sensor.redvision_can_bridge_manager30_output_current
        min: 0
        max: 60
        needle: true
        severity:
          green: 0
          yellow: 35
          red: 50
      - type: gauge
        name: Device Current
        entity: sensor.redvision_can_bridge_manager30_device_current
        min: 0
        max: 250
        needle: true
        severity:
          green: 0
          yellow: 80
          red: 150
      - type: gauge
        name: AC Input Voltage
        entity: sensor.redvision_can_bridge_manager30_ac_input_voltage
        min: 0
        max: 260
        needle: true
        severity:
          green: 220
          yellow: 200
          red: 0
      - type: gauge
        name: Manager30 Battery Voltage
        entity: sensor.redvision_can_bridge_manager30_battery_voltage
        min: 10
        max: 16
        needle: true
        severity:
          green: 12.4
          yellow: 11.8
          red: 0

  - type: entities
    title: Battery, Manager30 and AC
    show_header_toggle: false
    entities:
      - entity: sensor.redvision_can_bridge_manager30_output_current
        name: Manager30 Output Current
        icon: mdi:battery-charging
      - entity: sensor.redvision_can_bridge_manager30_output_current_raw
        name: Manager30 Output Current Raw
        icon: mdi:counter
      - entity: sensor.redvision_can_bridge_manager30_battery_voltage
        name: Manager30 Battery Voltage
        icon: mdi:car-battery
      - entity: sensor.redvision_can_bridge_manager30_ac_input_voltage
        name: AC Input Voltage
        icon: mdi:power-plug
      - entity: sensor.redvision_can_bridge_battery_current
        name: Battery Current
        icon: mdi:current-dc
      - entity: sensor.redvision_can_bridge_battery_current_raw
        name: Battery Current Raw
        icon: mdi:counter
      - entity: sensor.redvision_can_bridge_manager30_device_current
        name: Device Current
        icon: mdi:flash
      - entity: sensor.redvision_can_bridge_battery_soc
        name: Battery SOC
        icon: mdi:battery
      - entity: sensor.redvision_can_bridge_battery_voltage
        name: Battery Voltage
        icon: mdi:sine-wave
      - entity: sensor.redvision_can_bridge_battery_temperature
        name: Battery Temperature
        icon: mdi:thermometer

  - type: entities
    title: TVMS Voltage and Current Inputs
    show_header_toggle: false
