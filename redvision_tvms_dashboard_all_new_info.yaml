  - type: markdown
    content: "# Diagnostics"

  - type: markdown
    content: >
      # RedVision Diagnostics

      These cards show the Redvision display/rebroadcast values and raw source
      counters.

      Redvision values should broadly match the source-node values, but the
      Manager30 and Battery Sensor values are the primary measurements.

  - type: entities
    title: Redvision Display/Rebroadcast Values
    show_header_toggle: false
    entities:
      - entity: sensor.redvision_can_bridge_redvision1_battery_current_display
        name: Redvision 1 Battery Current Display
      - entity: sensor.redvision_can_bridge_redvision1_device_current_display
        name: Redvision 1 Device Current Display
      - entity: sensor.redvision_can_bridge_redvision2_manager_output_current_display
        name: Redvision 2 Manager Output Current Display

  - type: history-graph
    title: Source vs Redvision Current Comparison
    hours_to_show: 6
    entities:
      - entity: sensor.redvision_can_bridge_manager30_output_current
        name: Manager Source
      - entity: sensor.redvision_can_bridge_redvision2_manager_output_current_display
        name: Manager Redvision 2
      - entity: sensor.redvision_can_bridge_battery_current
        name: Battery Source
      - entity: sensor.redvision_can_bridge_redvision1_battery_current_display
        name: Battery Redvision 1
      - entity: sensor.redvision_can_bridge_manager30_device_current
        name: Device Derived
      - entity: sensor.redvision_can_bridge_redvision1_device_current_display
        name: Device Redvision 1

  - type: entities
    title: Raw Values
    show_header_toggle: false
    entities:
      - entity: sensor.redvision_can_bridge_manager30_output_current_raw
        name: Manager30 Output Current Raw
      - entity: sensor.redvision_can_bridge_battery_current_raw
        name: Battery Current Raw
      - entity: sensor.redvision_can_bridge_redvision2_manager_output_current_display_raw
        name: Redvision 2 Manager Output Current Display Raw
