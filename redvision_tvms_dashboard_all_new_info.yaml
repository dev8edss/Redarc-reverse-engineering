  - type: markdown
    content: >
      # RedVision Diagnostics

      These cards show CAN status and Redvision display/rebroadcast values.

      Redvision values should broadly match the source-node values, but the
      Manager30 and Battery Sensor values are the primary measurements.
  - type: entities
    title: Redvision Display/Rebroadcast Values
    show_header_toggle: false
    entities:
      - entity: sensor.redvision_can_bridge_redvision_battery_current_display
