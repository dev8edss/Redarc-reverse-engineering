  - type: custom:apexcharts-card
    header:
      show: true
      title: Battery SOC — Hourly History (%)
    graph_span: 24h
    yaxis:
      - min: 0
        max: 100
    series:
      - entity: sensor.redvision_can_bridge_battery_soc_hourly_history
        name: SOC %
        type: column
        data_generator: |
          const vals = (entity.state || "").split(",").filter((s) => s.length);
          const hr = 3600000;
          const now = Date.now();
          return vals
            .map((v, i) => {
              const n = parseInt(v, 10);
              return [now - i * hr, isNaN(n) ? null : n];
            })
            .sort((a, b) => a[0] - b[0]);
  - type: custom:apexcharts-card
    header:
      show: true
      title: Battery SOC — Daily Low / High (%)
    graph_span: 30d
    yaxis:
      - min: 0
        max: 100
    series:
      - entity: sensor.redvision_can_bridge_battery_soc_daily_range_history
        name: Low %
        type: column
        data_generator: |
          const vals = (entity.state || "").split(",").filter((s) => s.length);
          const day = 86400000;
          const base = new Date();
          base.setHours(0, 0, 0, 0);
          return vals
            .map((p, i) => {
              const lo = parseInt(p.split("-")[0], 10);
              return [base.getTime() - (i + 1) * day, isNaN(lo) ? null : lo];
            })
            .sort((a, b) => a[0] - b[0]);
      - entity: sensor.redvision_can_bridge_battery_soc_daily_range_history
        name: High %
        type: column
        data_generator: |
          const vals = (entity.state || "").split(",").filter((s) => s.length);
          const day = 86400000;
          const base = new Date();
          base.setHours(0, 0, 0, 0);
          return vals
            .map((p, i) => {
              const hi = parseInt(p.split("-")[1], 10);
              return [base.getTime() - (i + 1) * day, isNaN(hi) ? null : hi];
            })
            .sort((a, b) => a[0] - b[0]);
