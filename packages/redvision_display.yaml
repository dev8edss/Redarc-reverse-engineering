# vars: address (2 hex digits), name_prefix (must be a valid C++ identifier, no spaces)
redvision_display:
  - id: ${name_prefix}
    source_address: 0x${address}
    display_type: rv1
    battery_current_display:
      name: "${name_prefix} Battery Current Display"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      accuracy_decimals: 1
      filters:
        - throttle_average: ${sensor_average_interval}
    device_current_display:
      name: "${name_prefix} Device Current Display"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      accuracy_decimals: 1
      filters:
        - throttle_average: ${sensor_average_interval}
    battery_current_display_raw:
      name: "${name_prefix} Battery Current Display Raw"
      state_class: measurement
      entity_category: diagnostic
      accuracy_decimals: 0
      filters:
        - throttle_average: ${sensor_average_interval}
    device_current_display_raw:
      name: "${name_prefix} Device Current Display Raw"
      state_class: measurement
      entity_category: diagnostic
      accuracy_decimals: 0
      filters:
        - throttle_average: ${sensor_average_interval}
    manager_output_current_display:
      name: "${name_prefix} Manager Output Current Display"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      accuracy_decimals: 1
      filters:
        - throttle_average: ${sensor_average_interval}
    manager_output_current_display_raw:
      name: "${name_prefix} Manager Output Current Display Raw"
      state_class: measurement
      entity_category: diagnostic
      accuracy_decimals: 0
      filters:
        - throttle_average: ${sensor_average_interval}

canbus:
  - !extend rv_can
    on_frame:
      - can_id: 0x00000000
        can_id_mask: 0x00000000
        use_extended_id: true
        remote_transmission_request: false
        then:
          - lambda: id(${name_prefix}).handle_can_frame(can_id & 0x1FFFFFFFUL, x);
