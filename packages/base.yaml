esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "RedVision/TVMS CAN bridge; v86 split external components"

esp32:
  board: ${board}
  framework:
    type: ${esp32_framework_type}

logger:
  level: ${logger_level}
  # Raw CAN debug logging can be very high volume; use API logging instead of
  # UART so DEBUG boots do not overflow the ESP-IDF UART ringbuffer.
  baud_rate: ${logger_baud_rate}
  logs:
    # Silence the built-in canbus "received can message" DEBUG line; the
    # redarc_common dispatcher already logs every frame at DEBUG with
    # id/dgn/sa/rtr/dlc/data, so the canbus line is redundant noise.
    canbus: INFO

api:
  encryption:
    key: !secret api_pass

ota:
  - platform: esphome
    password: !secret ota_pass

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/dev8edss/Redarc-reverse-engineering
      ref: main
    refresh: 0s
    components:
      - redarc_common
      - redarc_tvms_rogue
      - redarc_tvms_1280
      - redarc_manager
      - redarc_battery_sensor
      - redarc_redvision_display

redarc_common:
  canbus_id: rv_can

canbus:
  - platform: esp32_can
    id: rv_can
    tx_pin: ${can_tx_pin}
    rx_pin: ${can_rx_pin}
    can_id: 0x7FE
    use_extended_id: true
    bit_rate: ${can_bit_rate}
    mode: ${can_mode}
    rx_queue_len: 64
    on_frame:
      - can_id: 0x00000000
        can_id_mask: 0x00000000
        use_extended_id: true
        # No remote_transmission_request filter, so RTR request frames are also
        # captured and logged (with rtr=1) instead of being dropped.
        then:
          - lambda: esphome::redarc_common::RedarcCanDispatcher::instance().dispatch(can_id & 0x1FFFFFFFUL, x, remote_transmission_request);
