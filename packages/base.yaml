esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "RedVision/TVMS CAN bridge; v86 split external components"

esp32:
  board: ${board}
  framework:
    type: arduino

logger:
  level: ${logger_level}

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/dev8edss/Redarc-reverse-engineering
      ref: main
    components:
      - redarc_common
      - tvms_rouge
      - tvms_1280
      - manager30
      - battery_sensor
      - redvision_display

canbus:
  - platform: esp32_can
    id: rv_can
    tx_pin: ${can_tx_pin}
    rx_pin: ${can_rx_pin}
    can_id: 0x7FE
    use_extended_id: true
    bit_rate: ${can_bit_rate}
    mode: ${can_mode}
    rx_queue_len: 64
