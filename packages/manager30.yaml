# vars: address (2 hex digits), name_prefix (must be a valid C++ identifier, no spaces)
manager30:
  id: ${name_prefix}
  source_address: 0x${address}
  output_current:
    name: "${name_prefix} Output Current"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - throttle_average: ${sensor_average_interval}
  output_current_raw:
    name: "${name_prefix} Output Current Raw"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    filters:
      - throttle_average: ${sensor_average_interval}
  battery_voltage:
    name: "${name_prefix} Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - throttle_average: ${sensor_average_interval}
  solar_current:
    name: "${name_prefix} Solar Current"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 3
    filters:
      - throttle_average: ${sensor_average_interval}
  solar_voltage:
    name: "${name_prefix} Solar Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 3
    filters:
      - throttle_average: ${sensor_average_interval}
  solar_power:
    name: "${name_prefix} Solar Power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - throttle_average: ${sensor_average_interval}
  solar_energy:
    name: "${name_prefix} Solar Energy"
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    filters:
      - throttle_average: ${sensor_average_interval}
  ac_input_voltage:
    name: "${name_prefix} AC Input Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle_average: ${sensor_average_interval}

canbus:
  - !extend rv_can
    on_frame:
      - can_id: 0x00000000
        can_id_mask: 0x00000000
        use_extended_id: true
        remote_transmission_request: false
        then:
          - lambda: id(${name_prefix}).handle_can_frame(can_id & 0x1FFFFFFFUL, x);
