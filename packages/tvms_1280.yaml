# vars: address (2 hex digits, TVMS1280 SA), host_address (2 hex digits, ESP32 SA), name_prefix (must be a valid C++ identifier, no spaces)
tvms_1280:
  id: ${name_prefix}
  canbus_id: rv_can
  source_address: 0x${address}
  command_id: 0x0F00${address}${host_address}
  temp_tank_id: 0x1BFD02${address}
  output_status_id: 0x1BFD00${address}
  channel_status_id: 0x1BFCF0${address}
  input_status_id: 0x13F108${address}
  temp1:
    name: "${name_prefix} Temperature 1"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle_average: ${sensor_average_interval}
  temp2:
    name: "${name_prefix} Temperature 2"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle_average: ${sensor_average_interval}
  supply_voltage:
    name: "${name_prefix} Supply Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - throttle_average: ${sensor_average_interval}
  voltage_input_1:
    name: "${name_prefix} Voltage Input 1 Candidate"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - throttle_average: ${sensor_average_interval}
  voltage_input_2:
    name: "${name_prefix} Voltage Input 2 Candidate"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - throttle_average: ${sensor_average_interval}
  tanks:
    - name: "${name_prefix} Tank 1"
      unit_of_measurement: "%"
      state_class: measurement
      accuracy_decimals: 0
      filters:
        - throttle_average: ${sensor_average_interval}
    - name: "${name_prefix} Tank 2"
      unit_of_measurement: "%"
      state_class: measurement
      accuracy_decimals: 0
      filters:
        - throttle_average: ${sensor_average_interval}
    - name: "${name_prefix} Tank 3"
      unit_of_measurement: "%"
      state_class: measurement
      accuracy_decimals: 0
      filters:
        - throttle_average: ${sensor_average_interval}
    - name: "${name_prefix} Tank 4"
      unit_of_measurement: "%"
      state_class: measurement
      accuracy_decimals: 0
      filters:
        - throttle_average: ${sensor_average_interval}
    - name: "${name_prefix} Tank 5"
      unit_of_measurement: "%"
      state_class: measurement
      accuracy_decimals: 0
      filters:
        - throttle_average: ${sensor_average_interval}
    - name: "${name_prefix} Tank 6"
      unit_of_measurement: "%"
      state_class: measurement
      accuracy_decimals: 0
      filters:
        - throttle_average: ${sensor_average_interval}
  last_command_channel:
    name: "${name_prefix} Last Output Command Channel"
    entity_category: diagnostic
    accuracy_decimals: 0
  last_command_state:
    name: "${name_prefix} Last Output Command State"
    entity_category: diagnostic
    accuracy_decimals: 0
  outputs:
    - output_number: 0
      channel: 0x04
      name: "${name_prefix} Output 0"
    - output_number: 1
      channel: 0x05
      name: "${name_prefix} Output 1"
    - output_number: 2
      channel: 0x06
      name: "${name_prefix} Output 2"
    - output_number: 3
      channel: 0x07
      name: "${name_prefix} Output 3"
    - output_number: 4
      channel: 0x08
      name: "${name_prefix} Output 4"
    - output_number: 5
      channel: 0x09
      name: "${name_prefix} Output 5"
    - output_number: 6
      channel: 0x0A
      name: "${name_prefix} Output 6"
    - output_number: 7
      channel: 0x0B
      name: "${name_prefix} Output 7"
    - output_number: 8
      channel: 0x0C
      name: "${name_prefix} Output 8"
    - output_number: 9
      channel: 0x0D
      name: "${name_prefix} Output 9"
  inverter:
    channel: 0x0E
    name: "${name_prefix} Inverter"

canbus:
  - !extend rv_can
    on_frame:
      - can_id: 0x00000000
        can_id_mask: 0x00000000
        use_extended_id: true
        remote_transmission_request: false
        then:
          - lambda: id(${name_prefix}).handle_can_frame(can_id & 0x1FFFFFFFUL, x);
