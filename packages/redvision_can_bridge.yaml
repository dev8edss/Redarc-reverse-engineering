number:
  - platform: template
    name: "TVMS Rouge Deadband"
    min_value: 0.5
    max_value: 10
    step: 0.5
    initial_value: 3
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    entity_category: config
    set_action:
      - lambda: id(tvms_rouge_hub).set_deadband(x);
  - platform: template
    name: "TVMS Rouge Initial Ramp Rate"
    min_value: 20
    max_value: 160
    step: 1
    initial_value: 50
    optimistic: true
    restore_value: true
    unit_of_measurement: "ms/%"
    entity_category: config
    set_action:
      - lambda: id(tvms_rouge_hub).set_initial_rate(x);
  - platform: template
    name: "TVMS Rouge Learning Gain"
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 25
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    entity_category: config
    set_action:
      - lambda: id(tvms_rouge_hub).set_learning_gain_percent(x);
  - platform: template
    name: "TVMS Rouge Approach"
    min_value: 25
    max_value: 100
    step: 5
    initial_value: 80
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    entity_category: config
    set_action:
      - lambda: id(tvms_rouge_hub).set_approach_percent(x);
  - platform: template
    name: "TVMS Rouge Max Pulse"
    min_value: 200
    max_value: 5000
    step: 50
    initial_value: 1200
    optimistic: true
    restore_value: true
    unit_of_measurement: "ms"
    entity_category: config
    set_action:
      - lambda: id(tvms_rouge_hub).set_max_pulse(x);
  - platform: template
    name: "TVMS Rouge Settle Time"
    min_value: 200
    max_value: 3000
    step: 50
    initial_value: 700
    optimistic: true
    restore_value: true
    unit_of_measurement: "ms"
    entity_category: config
    set_action:
      - lambda: id(tvms_rouge_hub).set_settle_time(x);
  - platform: template
    name: "TVMS Rouge Max Iterations"
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 12
    optimistic: true
    restore_value: true
    entity_category: config
    set_action:
      - lambda: id(tvms_rouge_hub).set_max_iterations_float(x);

button:
