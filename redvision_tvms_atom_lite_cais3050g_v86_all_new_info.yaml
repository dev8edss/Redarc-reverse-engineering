substitutions:
  device_name: redvision_can_bridge
  friendly_name: Redvision CAN Bridge

  # M5Stack Atom CAN Base / CA-IS3050G transceiver pins.
  can_tx_pin: GPIO22
  can_rx_pin: GPIO19

  # RedVision/TVMS bus speed.
  can_bit_rate: 250KBPS

  # NORMAL is required for transmitting TVMS1280 and TVMS Rouge commands.
  # Use LISTENONLY only for passive monitoring.
  can_mode: NORMAL

  sensor_average_interval: 5s
  board: m5stack-atom
  logger_level: INFO

  # ESP32 source address on the REDARC network (2 hex digits, no 0x prefix). Usually matches a redvision display address.
  host_address: "20"

packages:
  # Core infrastructure — ESPHome, ESP32, Wi-Fi, CAN hardware, external components.
  base:
    url: https://github.com/dev8edss/Redarc-reverse-engineering
    ref: main
    files: [packages/base.yaml]
    refresh: 0s

# Include only the devices present on your bus.
# Remove any block for devices you don't have.
# id becomes the entity name prefix — no spaces, use underscores.

battery_sensor:
  id: Battery
  source_address: 0x08

manager30:
  id: Manager30
  source_address: 0x01

# Multiple redvision displays are supported — add entries as needed.
redvision_display:
  - id: Redvision1
    source_address: 0x20
  - id: Redvision2
    source_address: 0x21

tvms_rouge:
  id: TVMS_Rouge
  source_address: 0x30
  host_address: 0x${host_address}

tvms_1280:
  id: TVMS1280
  source_address: 0x24
  host_address: 0x${host_address}
