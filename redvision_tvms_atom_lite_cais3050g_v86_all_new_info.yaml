substitutions:
  device_name: redvision_can_bridge
  friendly_name: Redvision CAN Bridge

  # M5Stack Atom CAN Base / CA-IS3050G transceiver pins.
  can_tx_pin: GPIO22
  can_rx_pin: GPIO19

  # RedVision/TVMS bus speed.
  can_bit_rate: 250KBPS

  # NORMAL is required for transmitting TVMS1280 and TVMS Rouge commands.
  # Use LISTENONLY only for passive monitoring.
  can_mode: NORMAL

  sensor_average_interval: 5s
  rouge_transition_length: 750ms
  board: m5stack-atom
  esp32_framework_type: esp-idf
  logger_level: DEBUG
  # Keep UART logging disabled when raw CAN debug is enabled. Use 115200 or 921600
  # only for short serial captures, because the CAN firehose can overflow UART.
  logger_baud_rate: "0"

  # ESP32 source address on the REDARC network (2 hex digits, no 0x prefix). Usually matches a redvision display address.
  host_address: "0x22"

packages:
  # Core infrastructure — ESPHome, ESP32, Wi-Fi, CAN hardware, external components.
  base:
    url: https://github.com/dev8edss/Redarc-reverse-engineering
    ref: main
    files: [packages/base.yaml]
    refresh: 0s

# Include only the devices present on your bus.
# Remove any block for devices you don't have.
# id becomes the entity name prefix — no spaces, use underscores.

redarc_battery_sensor:
  id: Battery
  source_address: 0x08
  host_address: ${host_address}
  filter_interval: ${sensor_average_interval}

redarc_manager:
  id: Manager30
  source_address: 0x01
  host_address: ${host_address}
  filter_interval: ${sensor_average_interval}
  battery_sensor_id: Battery

# Multiple redvision displays are supported — add entries as needed.
redarc_redvision_display:
  - id: Redvision1
    source_address: 0x20
    filter_interval: ${sensor_average_interval}
  - id: Redvision2
    source_address: 0x21
    filter_interval: ${sensor_average_interval}

redarc_tvms_rouge:
  id: TVMS_Rouge
  source_address: 0x30
  host_address: ${host_address}
  filter_interval: ${sensor_average_interval}
  default_transition_length: ${rouge_transition_length}

redarc_tvms_1280:
  id: TVMS1280
  source_address: 0x24
  host_address: ${host_address}
  filter_interval: ${sensor_average_interval}

# ---------------------------------------------------------------------------
# Replay the RedVision display's history-poll commands captured from the bus.
# Pressing the button re-emits the exact request frames a display sends, in
# order with the observed inter-frame timing, so the Manager/Battery reply with
# their history pages. Watch the raw replies in the DEBUG CAN log; the solar
# reply also refreshes Manager30 Solar Energy (the 0x1FCD6 receive handler is
# still in firmware).
#
# Captured from the display at source address 0x21 (Redvision2). The low byte
# of each request id is that display's address — change 21 if you impersonate
# a different display.
# ---------------------------------------------------------------------------
script:
  - id: replay_display_history_poll
    mode: restart
    then:
      # Solar generation history — confirmed in capture. The Manager (sa 0x01)
      # answers ~30 ms later on 0x03FCD601 with pages 00/01/02.
      - canbus.send:
          canbus_id: rv_can
          can_id: 0x1BFCD621
          use_extended_id: true
          data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      # --- SOC history — NOT present in the capture above --------------------
      # These ids are from earlier reverse-engineering (base 0x1BFCD0/2/4 | SA),
      # unconfirmed by this log, and the firmware no longer parses the replies
      # into entities. Uncomment to also emit them (100 ms apart, matching the
      # old display spacing) and observe the raw responses in the DEBUG CAN log.
      # - delay: 100ms
      # - canbus.send: { canbus_id: rv_can, can_id: 0x1BFCD021, use_extended_id: true, data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00] }
      # - delay: 100ms
      # - canbus.send: { canbus_id: rv_can, can_id: 0x1BFCD221, use_extended_id: true, data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00] }
      # - delay: 100ms
      # - canbus.send: { canbus_id: rv_can, can_id: 0x1BFCD421, use_extended_id: true, data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00] }

button:
  - platform: template
    name: "Replay Display History Poll"
    id: replay_display_history_poll_button
    icon: "mdi:history"
    on_press:
      - script.execute: replay_display_history_poll
