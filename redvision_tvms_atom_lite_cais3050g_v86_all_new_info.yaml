substitutions:
  device_name: redvision_can_bridge
  friendly_name: Redvision CAN Bridge

  # M5Stack Atom CAN Base / CA-IS3050G transceiver pins.
  can_tx_pin: GPIO22
  can_rx_pin: GPIO19

  # RedVision/TVMS bus speed.
  can_bit_rate: 250KBPS

  # NORMAL is required for transmitting TVMS1280 and TVMS Rouge commands.
  # Use LISTENONLY only for passive monitoring.
  can_mode: NORMAL

  sensor_average_interval: 5s
  board: m5stack-atom
  logger_level: INFO

  # REDARC network source addresses (2 hex digits, no 0x prefix).
  host_address: "20"
  battery_sensor_address: "08"
  manager30_address: "01"
  redvision_address: "20"
  tvms_rouge_address: "30"
  tvms_1280_address: "24"

packages:
  redvision_can_bridge:
    url: https://github.com/dev8edss/Redarc-reverse-engineering
    ref: main
    files: [packages/redvision_can_bridge.yaml]
    refresh: 0s
