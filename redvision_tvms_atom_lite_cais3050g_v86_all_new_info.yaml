substitutions:
  device_name: redvision_can_bridge
  friendly_name: Redvision CAN Bridge

  # M5Stack Atom CAN Base / CA-IS3050G transceiver pins.
  can_tx_pin: GPIO22
  can_rx_pin: GPIO19

  # RedVision/TVMS bus speed.
  can_bit_rate: 250KBPS

  # NORMAL is required for transmitting TVMS1280 and TVMS Rouge commands.
  # Use LISTENONLY only for passive monitoring.
  can_mode: NORMAL

  sensor_average_interval: 5s
  board: m5stack-atom
  logger_level: INFO

  # ESP32 source address on the REDARC network (2 hex digits, no 0x prefix).
  host_address: "20"

packages:
  # Core infrastructure — ESPHome, ESP32, Wi-Fi, CAN hardware, external components.
  base:
    url: https://github.com/dev8edss/Redarc-reverse-engineering
    ref: main
    files: [packages/base.yaml]
    refresh: 0s

  # Include only the devices present on your bus.
  # Remove any block for devices you don't have.
  # Duplicate a block with a unique key for multiple instances of the same device type.
  # name_prefix becomes the C++ component ID — no spaces allowed; use underscores instead.

  battery_sensor: !include
    file: packages/battery_sensor.yaml
    vars:
      address: "08"
      name_prefix: Battery

  manager30: !include
    file: packages/manager30.yaml
    vars:
      address: "01"
      name_prefix: Manager30

  redvision_display: !include
    file: packages/redvision_display.yaml
    vars:
      address: "20"
      name_prefix: Redvision

  tvms_rouge: !include
    file: packages/tvms_rouge.yaml
    vars:
      address: "30"
      name_prefix: TVMS_Rouge

  tvms_1280: !include
    file: packages/tvms_1280.yaml
    vars:
      address: "24"
      name_prefix: TVMS1280
